
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Personal Website</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f0ff;
      color: #25213b;
      text-align: center;
    }
    header {
      background: #6c3ce9;
      color: white;
      padding: 50px 20px;
    }
    h1 {
      font-size: 36px;
    }
    main {
      padding: 35px 20px;
    }
    .card {
      background: white;
      padding: 25px;
      margin: 20px auto;
      max-width: 500px;
      border-radius: 15px;
      box-shadow: 0 4px 15px #ddd;
    }
    footer {
      padding: 20px;
      background: #25213b;
      color: white;
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to My Website!</h1>
    <p>A little space on the internet that belongs to me.</p>
  </header>

  <main>
    <div class="card">
      <h2>About Me</h2>
      <p>Hello! Welcome to my personal website.</p>
      <p>I'm learning new skills and building my online presence.</p>
    </div>

    <div class="card">
      <h2>My Goals</h2>
      <p>Learn, grow, create, and achieve great things.</p>
    </div>
  </main>

  <footer>
    <p>Made with love ❤️</p>
  </footer>
</body>
</html>
